name: Historical research validation
on:
  workflow_dispatch:
    inputs:
      days:
        description: "Complete historical days (90–730)"
        required: true
        default: "365"
        type: choice
        options:
          - "180"
          - "365"
          - "730"
permissions:
  contents: read
jobs:
  historical:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        interval: ["1h", "4h"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Public historical market data and holdout evaluation
        run: python -m btc_engine.historical_run --interval ${{ matrix.interval }} --days ${{ inputs.days }} --output-dir research-output
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: btcusdt-${{ matrix.interval }}-historical-results
          path: research-output/
          if-no-files-found: warn
          retention-days: 14
